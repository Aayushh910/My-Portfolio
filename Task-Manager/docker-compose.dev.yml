# =================================================================
# Docker Compose Development Overlay (Hot Reloading with Bind Mounts)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npx", "nodemon", "server.js"]
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
