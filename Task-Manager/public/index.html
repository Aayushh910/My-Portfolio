<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Task Notebook 📖 - Spatial Light Interactive Task Management</title>
  
  <!-- React 18, ReactDOM 18 & Babel Standalone UMD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
      color: #0f172a;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      perspective: 1200px;
    }

    .font-caveat { font-family: 'Caveat', cursive, sans-serif; }
    .font-outfit { font-family: 'Outfit', sans-serif; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(217, 119, 6, 0.6); }

    #particle-fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 40;
      pointer-events: none;
    }

    /* 3D Tilt Card Base */
    .tilt-card {
      transform-style: preserve-3d;
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
      will-change: transform;
    }

    .tilt-card-inner {
      transform: translateZ(30px);
      transform-style: preserve-3d;
    }

    /* Light Theme Glassmorphism */
    .glass-card-light {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        0 15px 35px -5px rgba(15, 23, 42, 0.06),
        0 5px 15px -3px rgba(15, 23, 42, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .glass-notebook-light {
      background: linear-gradient(135deg, #ffffff 0%, #fefcf6 100%);
      box-shadow: 
        -15px 25px 45px -10px rgba(180, 140, 95, 0.25),
        0 0 0 1px rgba(217, 119, 6, 0.15),
        inset 0 0 30px rgba(254, 243, 199, 0.3);
    }

    /* Ruled Notebook Paper Lines */
    .notebook-ruled-lines {
      background-image: repeating-linear-gradient(
        transparent,
        transparent 39px,
        rgba(217, 119, 6, 0.14) 39px,
        rgba(217, 119, 6, 0.14) 40px
      );
      background-position: 0 18px;
    }

    /* Floating Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.4deg); }
    }

    @keyframes cardFlip {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.06); }
      100% { transform: rotateY(360deg) scale(1); }
    }

    @keyframes disintegrate {
      0% { opacity: 1; transform: scale(1) rotate(0deg) translateZ(0); filter: blur(0); }
      50% { opacity: 0.5; transform: scale(0.9) rotate(5deg) translateZ(40px); filter: blur(3px); }
      100% { opacity: 0; transform: scale(0.3) rotate(15deg) translateY(-40px) translateZ(80px); filter: blur(8px); }
    }

    @keyframes entry3d {
      0% { opacity: 0; transform: translateY(35px) translateZ(-80px) rotateX(-15deg) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) translateZ(0) rotateX(0deg) scale(1); }
    }

    .animate-float { animation: floatSlow 6s ease-in-out infinite; }
    .animate-entry-3d { animation: entry3d 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-flip { animation: cardFlip 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-disintegrate { animation: disintegrate 0.45s ease-forward forwards; }

    /* Dynamic Specular Light Glare */
    .glare-overlay {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 50%), rgba(255,255,255,0.6) 0%, transparent 65%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tilt-card:hover .glare-overlay { opacity: 1; }

    /* Metallic Spiral Rings */
    .spiral-ring {
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 45%, #ffffff 55%, #94a3b8 100%);
      box-shadow: 2px 4px 8px rgba(180, 140, 95, 0.25), inset 0 1px 2px rgba(255,255,255,0.9);
    }
  </style>
</head>
<body class="min-h-screen text-slate-900 relative selection:bg-amber-500 selection:text-white">

  <!-- Dynamic Particle FX Overlay Canvas -->
  <canvas id="particle-fx-canvas"></canvas>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Tactile Sound Effects Synthesizer ---
    const playAudioFx = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'complete') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.2);
          });
        } else if (type === 'delete') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.14);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.14);
        } else if (type === 'add') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.09);
        }
      } catch (e) {}
    };

    // --- Particle Burst System ---
    const spawnParticleBurst = (x, y, count = 30, colorType = 'gold') => {
      const canvas = document.getElementById('particle-fx-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = colorType === 'gold' 
        ? ['#f59e0b', '#d97706', '#fbbf24', '#6366f1', '#a855f7']
        : colorType === 'green'
        ? ['#10b981', '#059669', '#34d399', '#f59e0b']
        : ['#ef4444', '#dc2626', '#f87171', '#94a3b8'];

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 7;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          size: 3 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: 0.018 + Math.random() * 0.02,
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 8
        });
      }

      const animateParticles = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach((p) => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.12;
            p.alpha -= p.decay;
            p.rotation += p.vRot;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (active) {
          requestAnimationFrame(animateParticles);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      };

      animateParticles();
    };

    );

    const IconSearch = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">

      </svg>
    );

    const IconAlert = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    );

    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const IconSparkles = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
      </svg>
    );

    const IconCube = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
      </svg>
    );

    const IconLayers = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M6.429 9.75L2.25 12l10 5.25 10-5.25-4.179-2.25M6.429 14.25L2.25 16.5l10 5.25 10-5.25-4.179-2.25M12 3L2.25 8.25l10 5.25 10-5.25L12 3z" />
      </svg>
    );

    // --- Interactive 3D Tilt Component ---
    function TiltCard({ children, className = "", style = {}, popZ = 25 }) {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;

        cardRef.current.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(${popZ}px) scale(1.015)`;
        cardRef.current.style.setProperty('--glare-x', `${(x / rect.width) * 100}%`);
        cardRef.current.style.setProperty('--glare-y', `${(y / rect.height) * 100}%`);
      };

      const handleMouseLeave = () => {
        if (!cardRef.current) return;
        cardRef.current.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px) scale(1)`;
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`tilt-card relative ${className}`}
          style={style}
        >
          {children}
          <div className="glare-overlay" />
        </div>
      );
    }

    // --- Main Task Manager App ---
    function TaskApp() {
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      // Form state
      const [newTitle, setNewTitle] = useState("");
      const [newDescription, setNewDescription] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Edit state
      const [editingId, setEditingId] = useState(null);
      const [editingTitle, setEditingTitle] = useState("");
      const [editingDescription, setEditingDescription] = useState("");

      // Delete confirmation state
      const [deletingTask, setDeletingTask] = useState(null);
      const [disintegratingIds, setDisintegratingIds] = useState([]);
      const [flippingIds, setFlippingIds] = useState([]);

      // Filter & Search state
      const [filter, setFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");

      // 3D View Mode: 'notebook' | 'spatial'
      const [viewMode, setViewMode] = useState("notebook");

      // Pop-up Sticky Alerts
      const [alerts, setAlerts] = useState([]);

      const showAlert = (message, type = "success") => {
        const id = Date.now() + Math.random();
        setAlerts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setAlerts((prev) => prev.filter((a) => a.id !== id));
        }, 4000);
      };

      const removeAlert = (id) => {
        setAlerts((prev) => prev.filter((a) => a.id !== id));
      };

      // 1. READ: Fetch tasks from MongoDB
      const fetchTasks = async () => {
        try {
          setLoading(true);
          setError(null);
          const res = await fetch("/tasks");
          if (!res.ok) throw new Error(`Server status ${res.status}`);
          const data = await res.json();
          setTasks(Array.isArray(data) ? data : []);
        } catch (err) {
          console.error("Fetch tasks error:", err);
          setError("Unable to connect to notebook database.");
          showAlert("Failed to connect to backend server", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchTasks();
      }, []);

      // 2. CREATE: Add new task to MongoDB
      const handleAddTask = async (e) => {
        e.preventDefault();
        if (!newTitle.trim()) {
          showAlert("Please write a task title first!", "warning");
          return;
        }

        playAudioFx('add');

        if (e.target) {
          const rect = e.target.getBoundingClientRect();
          spawnParticleBurst(rect.right - 40, rect.top + rect.height / 2, 40, 'gold');
        }

        try {
          setIsSubmitting(true);
          const res = await fetch("/tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: newTitle.trim(),
              description: newDescription.trim()
            }),
          });

          const data = await res.json();
          if (!res.ok) {
            if (data.errors) {
              const firstErrKey = Object.keys(data.errors)[0];
              throw new Error(data.errors[firstErrKey] || data.message || "Validation Error");
            }
            throw new Error(data.message || "Failed to add task");
          }

          setTasks((prev) => [data, ...prev]);
          setNewTitle("");
          setNewDescription("");
          showAlert(`Task "${data.title}" saved to MongoDB!`, "success");
        } catch (err) {
          console.error("Add task error:", err);
          showAlert(err.message || "Could not save task", "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      // 3. UPDATE: Toggle Task Completed
      const handleToggleComplete = async (task, e) => {
        playAudioFx('complete');

        setFlippingIds((prev) => [...prev, task._id]);
        setTimeout(() => {
          setFlippingIds((prev) => prev.filter((id) => id !== task._id));
        }, 600);

        if (e && e.clientX) {
          spawnParticleBurst(e.clientX, e.clientY, 35, 'green');
        }

        const updatedCompleted = !task.completed;
        try {
          const res = await fetch(`/tasks/${task._id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: task.title,
              description: task.description,
              completed: updatedCompleted,
            }),
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || "Failed to update task");

          setTasks((prev) => prev.map((t) => (t._id === task._id ? data : t)));
          const statusText = data.completed ? "crossed off!" : "marked active";
          showAlert(`Task "${data.title}" ${statusText}`, "info");
        } catch (err) {
          console.error("Toggle complete error:", err);
          showAlert(err.message || "Failed to update task", "error");
        }
      };

      // 3. UPDATE: Edit Task Title & Description
      const startEditing = (task) => {
        playAudioFx('click');
        setEditingId(task._id);
        setEditingTitle(task.title);
        setEditingDescription(task.description || "");
      };

      const handleSaveEdit = async (task) => {
        if (!editingTitle.trim()) {
          showAlert("Task title cannot be empty!", "warning");
          return;
        }

        playAudioFx('click');
        try {
          const res = await fetch(`/tasks/${task._id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: editingTitle.trim(),
              description: editingDescription.trim(),
              completed: task.completed,
            }),
          });

          const data = await res.json();
          if (!res.ok) {
            if (data.errors) {
              const firstErrKey = Object.keys(data.errors)[0];
              throw new Error(data.errors[firstErrKey] || data.message || "Validation Error");
            }
            throw new Error(data.message || "Failed to update task");
          }

          setTasks((prev) => prev.map((t) => (t._id === task._id ? data : t)));
          setEditingId(null);
          showAlert(`Task updated to "${data.title}"`, "success");
        } catch (err) {
          console.error("Update task error:", err);
          showAlert(err.message || "Failed to update task", "error");
        }
      };

        if (!deletingTask) return;
        const targetId = deletingTask._id;
        setDeletingTask(null);

        playAudioFx('delete');
        spawnParticleBurst(window.innerWidth / 2, window.innerHeight / 2, 45, 'red');

        setDisintegratingIds((prev) => [...prev, targetId]);

        setTimeout(async () => {
          try {
            const res = await fetch(`/tasks/${targetId}`, { method: "DELETE" });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || "Failed to erase task");

            setTasks((prev) => prev.filter((t) => t._id !== targetId));
            setDisintegratingIds((prev) => prev.filter((id) => id !== targetId));
            showAlert(`Task "${deletingTask.title}" erased from MongoDB!`, "delete");
          } catch (err) {
            console.error("Delete task error:", err);
            showAlert(err.message || "Failed to erase task", "error");
            setDisintegratingIds((prev) => prev.filter((id) => id !== targetId));

        if (filter === "active") return matchesSearch && !t.completed;
        if (filter === "completed") return matchesSearch && t.completed;
        return matchesSearch;
      });

                                : "bg-gradient-to-r from-amber-600 to-indigo-600 hover:from-amber-500 hover:to-indigo-500 text-white shadow-amber-600/20"
                            }`}
                          >
                            <IconCheck className="w-4 h-4" />
                            {task.completed ? "Mark as Pending" : "Mark as Complete"}
                          </button>
                        </div>
                      )}
                    </TiltCard>
                  ))
                )}
              </div>
            )}
          </main>

          {/* Delete Confirmation Modal */}
          {deletingTask && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
              <TiltCard popZ={50} className="glass-card-light border border-rose-300 p-6 rounded-2xl max-w-sm w-full shadow-2xl space-y-4">
                <div className="flex items-center gap-3 text-rose-700">
                  <div className="w-10 h-10 rounded-xl bg-rose-100 flex items-center justify-center border border-rose-200">
                    <IconAlert className="w-6 h-6 text-rose-600" />
                  </div>
                  <div>
                    <h3 className="text-lg font-extrabold text-slate-900">Erase 3D Task?</h3>
                    <p className="text-xs text-rose-700">Action cannot be undone</p>
                  </div>
                </div>

                <p className="text-xs text-slate-700 leading-relaxed bg-amber-50/80 p-3 rounded-xl border border-amber-200/60">
                  Are you sure you want to erase <span className="font-bold text-amber-950">"{deletingTask.title}"</span> from your 3D notebook?
                </p>

                <div className="flex justify-end gap-3 pt-2">
                  <button
                    onClick={() => setDeletingTask(null)}
                    className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold rounded-xl transition"
                  >
                    Keep Task
                  </button>
                  <button
                    onClick={confirmDeleteTask}
                    className="px-4 py-2 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white text-xs font-extrabold rounded-xl transition shadow-md shadow-rose-600/20 flex items-center gap-1.5"
                  >
                    <IconTrash className="w-3.5 h-3.5" /> Erase Task
                  </button>
                </div>
              </TiltCard>
            </div>
          )}

          {/* Footer Branding */}
          <footer className="max-w-4xl mx-auto mt-12 py-6 text-center text-xs text-slate-500 font-medium">
            3D Task Notebook • Powered by Three.js Light Mode & React
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TaskApp />);
  </script>
</body>
</html>
